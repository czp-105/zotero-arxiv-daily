name: Check DeepSeek
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7.1.4
      - name: Verify API connection without sending email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          uv run python - <<'PY'
          import json, os, sys
          from openai import OpenAI
          from omegaconf import OmegaConf
          from zotero_arxiv_daily.protocol import _request_llm

          key = os.environ['OPENAI_API_KEY']
          base = os.environ['OPENAI_API_BASE']
          print(json.dumps({
              'key_empty': not key,
              'key_has_whitespace': any(c.isspace() for c in key),
              'key_is_ascii': key.isascii(),
              'official_base_url': base == 'https://api.deepseek.com',
              'base_has_whitespace': any(c.isspace() for c in base),
          }))
          config = OmegaConf.merge(OmegaConf.load('config/base.yaml'), OmegaConf.create(os.environ['CUSTOM_CONFIG']))
          config.llm.generation_kwargs.max_tokens = 64
          try:
              with OpenAI(api_key=key, base_url=base, timeout=20, max_retries=0) as client:
                  output = _request_llm(client, config.llm, [{'role': 'user', 'content': 'Reply only OK.'}])
                  assert output and output.strip(), 'Empty model response'
          except Exception as error:
              types = []
              cause = error
              while cause is not None and len(types) < 5:
                  types.append(type(cause).__name__)
                  cause = cause.__cause__
              print(json.dumps({'exception_types': types, 'http_status': getattr(error, 'status_code', None)}))
              sys.exit(1)
          print('DeepSeek response received successfully')
          PY
